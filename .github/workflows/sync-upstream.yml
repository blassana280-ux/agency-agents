name: Sync amont + veille quotidienne

on:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-amont
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration git
        run: |
          git config user.name "Lassana Bah (bot)"
          git config user.email "blassana280-ux@users.noreply.github.com"

      - name: Ajout du remote amont et fetch
        run: |
          git remote add upstream https://github.com/msitarzewski/agency-agents.git || true
          git fetch upstream main

      - name: Reparation - revert du commit corrompu f287483
        id: revert
        run: |
          echo "reverted=0" >> "$GITHUB_OUTPUT"
          if git log --oneline --grep="revert f287483" | grep -q .; then
            echo "Revert deja present, on continue."
          elif git cat-file -e f287483acbb9f0fe0a8eadfd1aa4b4f8815ec485 2>/dev/null && git merge-base --is-ancestor f287483acbb9f0fe0a8eadfd1aa4b4f8815ec485 HEAD; then
            git revert --no-commit f287483acbb9f0fe0a8eadfd1aa4b4f8815ec485
            git commit -m "revert f287483: repare les fichiers alteres par une lecture corrompue (db-optimizer, embedded-firmware)"
            echo "reverted=1" >> "$GITHUB_OUTPUT"
          else
            echo "Commit f287483 absent, rien a faire."
          fi

      - name: Fusion amont (auto, fallback -X ours)
        id: merge
        run: |
          BEFORE=$(git rev-list --count HEAD..upstream/main)
          echo "before=$BEFORE" >> "$GITHUB_ENV"
          if [ "$BEFORE" = "0" ]; then
            echo "already=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONFLICTED=""
          if ! git merge upstream/main --no-edit; then
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            git merge --abort
            git merge -X ours upstream/main --no-edit
          fi
          printf '%s\n' "$CONFLICTED" > /tmp/conflicted.txt

      - name: Push du resultat
        if: steps.revert.outputs.reverted == '1' || steps.merge.outputs.already != '1'
        run: git push origin main

      - name: Rapport dans le depot
        if: steps.revert.outputs.reverted == '1' || steps.merge.outputs.already != '1'
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          mkdir -p docs/sync-reports
          REPORT="docs/sync-reports/$DATE.md"
          {
            echo "# Sync amont du $DATE"
            echo ""
            echo "- Commits amont integres : $BEFORE"
            echo "- Strategie de conflit : fork prioritaire (-X ours) - hunks en conflit resolus en faveur des versions augmentees du fork"
            echo "- Fichiers en conflit (correctifs amont non appliques dessus) :"
            echo ""
            echo '~~~'
            cat /tmp/conflicted.txt 2>/dev/null || echo "(aucun)"
            echo '~~~'
          } >> "$REPORT"
          git add "$REPORT"
          git commit -m "docs: rapport sync amont du $DATE" || echo "Rien de nouveau a committer"
          git push origin main
