# repair-ci v7: renomme l agent orchestration en collision de slug (omniroute-commander)
name: Repair CI consistency

on:
  push:
    paths:
      - ".github/workflows/repair-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-ci
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration git
        run: |
          git config user.name "Lassana Bah (bot)"
          git config user.email "blassana280-ux@users.noreply.github.com"

      - name: Diagnostic avant reparation
        run: |
          mkdir -p /tmp/cidiag
          {
            echo "## check-divisions.sh"
            bash scripts/check-divisions.sh 2>&1 || true
            echo ""
            echo "## check-tools.sh"
            bash scripts/check-tools.sh 2>&1 || true
            echo ""
            echo "## test-convert-outputs.sh (advisory)"
            bash scripts/test-convert-outputs.sh --drift=advisory 2>&1 || true
          } > /tmp/cidiag/before.md 2>&1
          cat /tmp/cidiag/before.md

      - name: README orchestration hors conversion si pas un agent
        run: |
          if [ -f orchestration/README.md ] && [ "$(head -n 1 orchestration/README.md | tr -d '\r')" != "---" ]; then
            git mv orchestration/README.md orchestration/README || true
            echo "orchestration/README.md deplace en orchestration/README (pas de frontmatter)"
          fi

      - name: Reparation des divisions
        run: python3 scripts/fix-ci-consistency.py

      - name: Renomme l agent orchestration en collision de slug
        run: |
          if grep -qE '^name:[[:space:]]*OmniRoute Commander[[:space:]]*$' orchestration/omniroute-commander.md; then
            sed -i -E 's/^name:[[:space:]]*OmniRoute Commander[[:space:]]*$/name:        OmniRoute OmniBrain Commander/' orchestration/omniroute-commander.md
            echo "Renomme: OmniRoute Commander -> OmniRoute OmniBrain Commander (collision de slug avec specialized/specialized-omniroute-commander.md)"
          else
            echo "Pas de collision a renommer (deja fait)"
          fi

      - name: Regeneration des sorties converties (integrations/)
        run: |
          bash scripts/convert.sh --parallel 2>&1 | tail -n 30

      - name: Regeneration du manifeste convert-outputs
        run: |
          bash scripts/test-convert-outputs.sh --update 2>&1 | tail -n 40 || true

      - name: Diagnostic apres reparation + rapport
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p docs/ci-diagnostics
          {
            echo "# Rapport de reparation CI - $DATE"
            echo ""
            echo "## Etat avant reparation"
            echo ""
            cat /tmp/cidiag/before.md
            echo ""
            echo "## Etat apres reparation"
            echo ""
            echo "### check-divisions.sh"
            bash scripts/check-divisions.sh 2>&1 || true
            echo ""
            echo "### check-tools.sh"
            bash scripts/check-tools.sh 2>&1 || true
            echo ""
            echo "### check-hermes-plugin.py"
            python3 scripts/check-hermes-plugin.py 2>&1 || true
            echo ""
            echo "### test-convert-slug-collisions.sh"
            bash scripts/test-convert-slug-collisions.sh 2>&1 | tail -n 40 || true
            echo ""
            echo "### test-convert-frontmatter.sh"
            bash scripts/test-convert-frontmatter.sh 2>&1 | tail -n 40 || true
            echo ""
            echo "### lint orchestration"
            bash scripts/lint-agents.sh orchestration/*.md 2>&1 | tail -n 30 || true
            echo ""
            echo "### slugs dupliques"
            python3 scripts/list-duplicate-slugs.py 2>&1 || true
          } > "docs/ci-diagnostics/$DATE.md" 2>&1
          cat "docs/ci-diagnostics/$DATE.md"

      - name: Commit et push
        run: |
          git checkout -B main "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- .github/workflows || true
          git add -A
          if git diff --cached --quiet; then
            echo "Rien a committer"
            exit 0
          fi
          git commit -m "fix(ci): renomme OmniRoute Commander (orchestration) en OmniRoute OmniBrain Commander - collision de slug omniroute-commander"
          git fetch origin main
          git rebase origin/main
          git push origin main
